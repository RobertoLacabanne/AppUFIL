# Levantar el sistema:   docker compose up -d
# Ver la interfaz:       http://127.0.0.1:8713
#
# El corpus se monta :ro — SOLO LECTURA. Es la restricción 2 hecha cumplir por el
# sistema operativo y no por buena voluntad del código: aunque el programa tuviera un
# error, el kernel no lo dejaría escribir ahí.
services:
  ufil:
    build: .
    image: ufil-analisis:0.1
    container_name: ufil
    user: "10001:10001"           # sin privilegios: root ignoraría el 0444 de los originales
    # Sin red hacia afuera. El contenedor no puede salir a internet ni queriendo.
    network_mode: bridge
    ports:
      # Sólo esta máquina. Si esto se cambiara a "0.0.0.0:8713:8713" para entrar desde
      # un celular, hay que sacar `UFIL_ACCESO: abierto` de acá abajo en la misma
      # edición: esa variable existe porque esta línea dice 127.0.0.1, y sin ella el
      # sistema pide clave. Cambiar una sin la otra deja el legajo abierto a la red.
      - "127.0.0.1:8713:8713"
    environment:
      # Acá SÍ corresponde: el puerto de arriba se publica en 127.0.0.1, o sea que a
      # este servicio sólo llega quien ya está sentado en esta máquina. Pedirle clave
      # sería mandarlo a buscarla a `docker compose logs`.
      #
      # Va acá y no en el Dockerfile justamente por eso: la variable dice algo sobre la
      # PUBLICACIÓN, y la publicación se declara tres líneas más arriba. En la imagen
      # viajaba con ella a cualquier lado —incluido un servicio de nube, donde el puerto
      # sale a internet— y ahí la afirmación es falsa.
      #
      # Si la publicación de arriba cambia a `0.0.0.0:8713:8713`, HAY QUE SACAR esta
      # línea en la misma edición.
      UFIL_ACCESO: abierto
    volumes:
      - ./corpus:/corpus:ro
      - ./datos:/app/datos
    restart: unless-stopped
