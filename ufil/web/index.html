<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UFIL · Análisis documental</title>
<meta name="theme-color" content="#23594C" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1213" media="(prefers-color-scheme: dark)">
<!-- Ícono de pestaña embebido: sin llamada de red (restricción 1). Es el mismo
     monograma que la barra lateral —una foja con su lomo y un filete dorado—, para
     que la pestaña y la aplicación se reconozcan entre sí. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2323594C'/%3E%3Crect x='7' y='6' width='18' height='20' rx='1.5' fill='none' stroke='%23F4F8F6' stroke-width='1.6'/%3E%3Cline x1='11.5' y1='6' x2='11.5' y2='26' stroke='%23F4F8F6' stroke-width='1.3'/%3E%3Cline x1='15' y1='12' x2='21.5' y2='12' stroke='%23D7B46A' stroke-width='2.2'/%3E%3Cline x1='15' y1='16.5' x2='21.5' y2='16.5' stroke='%23F4F8F6' stroke-width='1.4'/%3E%3Cline x1='15' y1='21' x2='19' y2='21' stroke='%23F4F8F6' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/estatico/estilo.css">
</head>
<body>

<!-- Quien navega con el teclado no tiene por qué recorrer dieciséis enlaces de la
     barra lateral antes de llegar a lo que vino a leer. -->
<a class="saltar" href="#vista">Saltar al contenido</a>

<!-- ── La barra lateral ────────────────────────────────────────────────────
     Verde institucional macizo. Arriba la marca, con la jerarquía completa de la
     casa; en el medio las secciones; abajo lo que casi nunca se toca. -->
<aside id="lateral" aria-label="Secciones del sistema">
  <div class="identidad">
    <a class="identidad-enlace" href="#/panel">
      <span class="monograma" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30">
          <rect x="5" y="4" width="22" height="24" rx="2" fill="none"
                stroke="currentColor" stroke-width="1.7"/>
          <line x1="10" y1="4" x2="10" y2="28" stroke="currentColor" stroke-width="1.3"/>
          <line x1="14" y1="11" x2="23" y2="11" stroke="var(--oro)" stroke-width="2.4"/>
          <line x1="14" y1="16.5" x2="23" y2="16.5" stroke="currentColor" stroke-width="1.4"/>
          <line x1="14" y1="22" x2="20" y2="22" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </span>
      <span class="identidad-texto">
        <b class="identidad-unidad" id="m-unidad">UFIL Paraná</b>
        <span class="identidad-area" id="m-area">Área Anticorrupción</span>
      </span>
    </a>
    <!-- El archivo oficial del organismo, si está puesto (ver assets/marca/LEEME.md).
         Mientras no esté, manda el monograma y la línea de texto de abajo. -->
    <img id="identidad-oficial" class="identidad-oficial" src="/marca" alt="" hidden>
    <p class="identidad-organismo" id="m-organismo"></p>
  </div>

  <nav class="nav-lateral" id="nav-secciones" aria-label="Secciones"></nav>

  <div class="lateral-pie">
    <button class="pie-boton" id="b-tema" type="button" aria-pressed="false"></button>
    <a class="pie-boton" href="#/acerca">Acerca del sistema</a>
  </div>
</aside>

<!-- El velo que apaga el fondo cuando la barra se abre en un teléfono. -->
<div id="velo" hidden></div>

<div id="cuerpo">

  <!-- ── La barra de arriba ──────────────────────────────────────────────
       Qué legajo está abierto, de qué lote vino, qué está haciendo el sistema en
       este momento y cuánto falta revisar. Todo eso junto y siempre a la vista:
       cada legajo es una base separada, y mirar el número equivocado es mirar
       otra causa. -->
  <header id="techo">
    <button class="techo-menu" id="b-menu" type="button"
            aria-label="Abrir las secciones" aria-expanded="false" aria-controls="lateral">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
        <path d="M2 5h16M2 10h16M2 15h16" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" fill="none"/>
      </svg>
    </button>

    <a class="techo-legajo" href="#/legajos" id="t-legajo">
      <span class="etq">Legajo</span>
      <b class="mono" id="l-numero">—</b>
      <span class="caratula" id="l-caratula"></span>
    </a>

    <div class="techo-medio">
      <span class="techo-dato" id="t-lote" hidden>
        <span class="etq">Lote</span> <span id="f-lote"></span>
      </span>
      <span id="sello-estado" class="estado"></span>
    </div>

    <form class="techo-buscar" id="t-buscar" role="search">
      <label class="oculto" for="q-rapida">Buscar en el legajo</label>
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" class="icono-buscar">
        <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M10.4 10.4L14 14" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round"/>
      </svg>
      <input id="q-rapida" type="search" placeholder="Buscar nombre, documento, monto…"
             autocomplete="off">
    </form>
  </header>

  <div id="aviso-demo" hidden>
    <span class="estado estado--alerta">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path
        d="M8 1.6 15 14H1z" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linejoin="round"/><path d="M8 6v3.4M8 11.4v.1" stroke="currentColor"
        stroke-width="1.6" stroke-linecap="round"/></svg>
      Datos de demostración
    </span>
    <span>Ninguno de estos contratos es real. Son documentos generados para probar el
      sistema: los nombres son inventados y los números de documento no corresponden a
      ninguna persona.</span>
  </div>

  <main id="vista"><div class="esqueleto"><i></i><i></i><i></i></div></main>
</div>

<script src="/estatico/app.js"></script>
</body>
</html>
