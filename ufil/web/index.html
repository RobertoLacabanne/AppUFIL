<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UFIL · Análisis documental</title>
<meta name="theme-color" content="#011E3F" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1119" media="(prefers-color-scheme: dark)">
<!-- Ícono de pestaña embebido: sin llamada de red (restricción 1). Es el mismo
     monograma que la barra lateral —una foja con su lomo y un filete dorado—, para
     que la pestaña y la aplicación se reconozcan entre sí. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23011E3F'/%3E%3Crect x='7' y='6' width='18' height='20' rx='1.5' fill='none' stroke='%23F2F6FA' stroke-width='1.6'/%3E%3Cline x1='11.5' y1='6' x2='11.5' y2='26' stroke='%23F2F6FA' stroke-width='1.3'/%3E%3Cline x1='15' y1='12' x2='21.5' y2='12' stroke='%23D7B46A' stroke-width='2.2'/%3E%3Cline x1='15' y1='16.5' x2='21.5' y2='16.5' stroke='%23F2F6FA' stroke-width='1.4'/%3E%3Cline x1='15' y1='21' x2='19' y2='21' stroke='%23F2F6FA' stroke-width='1.4'/%3E%3C/svg%3E">
<!-- El ícono oficial, si está puesto. No se declara acá con un `<link>` porque
     entonces, sin el archivo, la pestaña se queda sin ningún ícono: lo pone app.js
     recién cuando comprueba que carga, y mientras tanto manda el monograma de
     arriba, que está embebido y no depende de nada. -->
<link rel="apple-touch-icon" href="/marca?que=tactil">
<link rel="stylesheet" href="/estatico/estilo.css">
</head>
<body>

<!-- Quien navega con el teclado no tiene por qué recorrer dieciséis enlaces de la
     barra lateral antes de llegar a lo que vino a leer. -->
<a class="saltar" href="#vista">Saltar al contenido</a>

<!-- ── La barra lateral ────────────────────────────────────────────────────
     Azul tribunal macizo. Arriba el isotipo oficial con la jerarquía completa de la
     casa; en el medio las secciones; abajo lo que casi nunca se toca.
     Decía «verde institucional» y hacía rato que no era cierto: la paleta pasó al azul
     porque el token del cromo y el del estado «firme» eran el mismo verde, así que el
     color que decía «el sistema afirma que este dato es firme» era el mismo que decía
     «esto es un botón». El motivo completo está en DESIGN_SYSTEM.md §2. Un comentario
     que dice justo lo que el sistema decidió NO hacer es peor que no tener comentario:
     el próximo que lo lea lo va a tomar por especificación. -->
<aside id="lateral" aria-label="Secciones del sistema">
  <div class="identidad">
    <a class="identidad-enlace" href="#/panel">
      <span class="monograma" id="monograma" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30">
          <rect x="5" y="4" width="22" height="24" rx="2" fill="none"
                stroke="currentColor" stroke-width="1.7"/>
          <line x1="10" y1="4" x2="10" y2="28" stroke="currentColor" stroke-width="1.3"/>
          <line x1="14" y1="11" x2="23" y2="11" stroke="var(--oro)" stroke-width="2.4"/>
          <line x1="14" y1="16.5" x2="23" y2="16.5" stroke="currentColor" stroke-width="1.4"/>
          <line x1="14" y1="22" x2="20" y2="22" stroke="currentColor" stroke-width="1.4"/>
        </svg>
      </span>
      <!-- El isotipo oficial del organismo (ver assets/marca/LEEME.md). Va en el
           lugar del monograma, no abajo: son dos maneras de decir lo mismo y una
           sola tiene que quedar. Se elige sola —si el archivo carga, manda el
           isotipo; si no está, manda el monograma— y por eso el `hidden` arranca
           acá y lo saca el navegador, no una consulta al servidor: así también
           anda en el índice de legajos, donde no hay panel que preguntar.

           Va el ISOTIPO, no el logotipo con el texto: el wordmark oficial está en
           marino y sobre la barra marina desaparece. Recolorearlo a blanco sería
           intervenir la marca, que es justo lo que no corresponde hacerle a un
           logotipo institucional. El nombre va al lado, compuesto en la tipografía
           de la aplicación. -->
      <img id="identidad-oficial" class="isotipo" src="/marca" alt="" hidden>
      <span class="identidad-texto">
        <b class="identidad-unidad" id="m-unidad">UFIL Paraná</b>
        <span class="identidad-area" id="m-area">Área Anticorrupción</span>
      </span>
    </a>
    <!-- Acá estaba la marca provincial dibujada a mano: dos líneas por los ríos y
         una diagonal por la franja de Artigas. Se fue cuando llegó el isotipo
         oficial, y está bien que se haya ido: eran tres maneras apiladas de decir de
         quién es esto —un ícono genérico, un dibujo propio y una línea de texto— y a
         13 px de alto la diagonal roja se leía como un tachado. Ahora lo dice el
         isotipo, una sola vez y con la marca de verdad. -->
    <p class="identidad-organismo" id="m-organismo"></p>
    <!-- Quién firma. Viene de ufil/identidad.py y no escrito acá: cambiar de fiscal no
         puede obligar a tocar seis archivos. -->
    <p class="identidad-fiscales" id="m-fiscales" hidden></p>
  </div>

  <nav class="nav-lateral" id="nav-secciones" aria-label="Secciones"></nav>

  <div class="lateral-pie">
    <!-- Quién está trabajando. Cada decisión queda registrada con este nombre, así que
         tiene que estar a la vista siempre: si alguien se sienta en la máquina de otro
         y no lo nota, el registro dice el nombre equivocado. -->
    <button class="pie-boton" id="b-revisor" type="button">
      <svg viewBox="0 0 18 18" width="15" height="15" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <circle cx="9" cy="6" r="3"/><path d="M2.8 15.6a6.2 6.2 0 0 1 12.4 0"/>
      </svg>
      <span class="txt"><span class="etq">Trabajando como</span>
        <span class="quien">Sin identificar</span></span>
    </button>
    <button class="pie-boton" id="b-tema" type="button" aria-pressed="false"></button>
    <a class="pie-boton" href="#/acerca">Acerca del sistema</a>
  </div>
</aside>

<!-- El velo que apaga el fondo cuando la barra se abre en un teléfono. -->
<div id="velo" hidden></div>

<div id="cuerpo">

  <!-- ── La barra de arriba ──────────────────────────────────────────────
       Qué legajo está abierto, de qué lote vino, qué está haciendo el sistema en
       este momento y cuánto falta revisar. Todo eso junto y siempre a la vista:
       cada legajo es una base separada, y mirar el número equivocado es mirar
       otra causa. -->
  <header id="techo">
    <button class="techo-menu" id="b-menu" type="button"
            aria-label="Abrir las secciones" aria-expanded="false" aria-controls="lateral">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
        <path d="M2 5h16M2 10h16M2 15h16" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" fill="none"/>
      </svg>
    </button>

    <a class="techo-legajo" href="#/legajos" id="t-legajo">
      <span class="etq">Legajo</span>
      <b class="mono" id="l-numero">—</b>
      <span class="caratula" id="l-caratula"></span>
    </a>

    <div class="techo-medio">
      <!-- El lote es una PROPIEDAD del legajo, no un par suyo. Iba al lado del
           número de legajo con el mismo peso, y los dos se leían como dos
           identificadores compitiendo: «LEGAJO 87.933» y «LOTE demostracion». Ahora va
           con el tratamiento de la marginalia —versalitas y tinta apagada— que es lo
           que es. -->
      <span class="techo-dato" id="t-lote" hidden>
        <span class="etq">Lote</span> <span id="f-lote"></span>
      </span>
      <span id="sello-estado" class="estado"></span>
    </div>

    <form class="techo-buscar" id="t-buscar" role="search">
      <label class="oculto" for="q-rapida">Buscar en el legajo</label>
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" class="icono-buscar">
        <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M10.4 10.4L14 14" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round"/>
      </svg>
      <input id="q-rapida" type="search" placeholder="Buscar nombre, documento, monto…   /"
             autocomplete="off">
    </form>
  </header>

  <!-- ── El encabezado que sale IMPRESO ────────────────────────────────────
       Sólo existe en papel: en pantalla la identidad ya está en la barra lateral, y
       repetirla arriba de cada folio sería decir dos veces lo mismo. Pero una hoja
       que sale de este sistema y termina agregada a un legajo tiene que decir de
       dónde salió sin depender de que alguien se acuerde de escribirlo. -->
  <div id="membrete" aria-hidden="true">
    <img id="membrete-marca" src="/marca" alt="">
    <div class="membrete-texto">
      <b id="membrete-organismo">Ministerio Público Fiscal · Provincia de Entre Ríos</b>
      <span id="membrete-unidad">UFIL Paraná — Área Anticorrupción</span>
    </div>
    <div class="membrete-emision">
      <span id="membrete-legajo"></span>
      <span id="membrete-fecha"></span>
    </div>
  </div>

  <!-- ── La foja entera, a pantalla completa ──────────────────────────────
       La miniatura del costado sirve para ver que la hoja existe; no para leer un
       importe. Acá la foja va al tamaño del escaneo, con desplazamiento, y con el
       recuadro del campo dibujado encima si el sistema le puso alguno —ver dónde CREE
       que está el campo es la mitad de entender por qué falló—. -->
  <div id="visor" hidden role="dialog" aria-modal="true" aria-labelledby="visor-rotulo">
    <div class="visor-barra">
      <span id="visor-rotulo" class="mono"></span>
      <button class="boton gris" id="visor-cerrar" type="button">Cerrar</button>
    </div>
    <div class="visor-hoja">
      <div class="visor-lienzo">
        <img id="visor-img" alt="">
        <div id="visor-marco" hidden></div>
      </div>
    </div>
  </div>

  <div id="aviso-demo" hidden
       title="Ninguno de estos contratos es real. Son documentos generados para probar el sistema: los nombres son inventados y los números de documento no corresponden a ninguna persona.">
    <span class="estado estado--alerta">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path
        d="M8 1.6 15 14H1z" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linejoin="round"/><path d="M8 6v3.4M8 11.4v.1" stroke="currentColor"
        stroke-width="1.6" stroke-linecap="round"/></svg>
      Datos de demostración
    </span>
    <!-- Un cuño es breve o no es un cuño: el párrafo entero adentro lo convertía en un
         cartel de 240×144 px. La explicación completa vive en el `title`. -->
    <span>Ningún contrato de acá es real</span>
  </div>

  <main id="vista"><div class="esqueleto"><i></i><i></i><i></i></div></main>
</div>

<script src="/estatico/app.js"></script>
</body>
</html>
